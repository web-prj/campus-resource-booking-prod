name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint without modifying files
        run: npx --no-install eslint "{src,apps,libs,test}/**/*.ts"
      - name: Test
        run: npm test -- --runInBand
      - name: Build
        run: npm run build

  backend-e2e:
    name: Backend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229 # 16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: web_backend_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d web_backend_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      PORT: 18320
      API_PREFIX: api
      CORS_ORIGINS: http://localhost:18321
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: web_backend_test
      DB_SYNCHRONIZE: "false"
      DB_LOGGING: "false"
      AUTH_JWT_SECRET: ci-only-secret-value-at-least-32-characters
      AUTH_TOKEN_EXPIRES_IN: 15m
      AUTH_COOKIE_NAME: access_token
      AUTH_COOKIE_SAME_SITE: lax
      AUTH_COOKIE_SECURE: "false"
      AUTH_BCRYPT_ROUNDS: 10
      THROTTLE_TTL: 60
      THROTTLE_LIMIT: 100000
      AUTH_THROTTLE_LIMIT: 100000
      BOOKING_RELEASE_INTERVAL_SECONDS: 0
    defaults:
      run:
        working-directory: web-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web-backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Apply database migrations
        run: npm run migration:run
      - name: Verify latest migration rollback
        run: npm run migration:revert && npm run migration:run
      - name: Verify entities match the migrated schema
        run: npm run typeorm -- schema:log | tee /tmp/schema.log && grep -q "Your schema is up to date" /tmp/schema.log
      - name: Run end-to-end tests
        run: npm run test:e2e -- --runInBand

  container-startup:
    name: Compiled container startup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTH_JWT_SECRET: ci-only-container-secret-at-least-32-characters
      DB_PASSWORD: ci-only-postgres-password
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and start the compiled stack with migrations
        run: docker compose up -d --build --wait
      - name: Verify the migration and restart without reapplying it
        run: |
          set -euo pipefail
          docker compose exec -T postgres psql -U postgres -d web_backend -v ON_ERROR_STOP=1 \
            -c "SELECT session_version FROM users LIMIT 1"
          docker compose exec -T backend node node_modules/typeorm/cli.js migration:show -d dist/database/data-source.js \
            | tee /tmp/container-migrations-before.log
          ! grep -q '\[ \]' /tmp/container-migrations-before.log
          docker compose restart backend
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q backend)")" = healthy ]; then
              break
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q backend)")" = healthy
          docker compose exec -T backend node node_modules/typeorm/cli.js migration:show -d dist/database/data-source.js \
            | tee /tmp/container-migrations.log
          ! grep -q '\[ \]' /tmp/container-migrations.log
      - name: Show logs if startup fails
        if: failure()
        run: docker compose logs --tail=150
      - name: Stop disposable stack
        if: always()
        run: docker compose down --volumes
